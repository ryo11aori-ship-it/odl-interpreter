name: Build ODL Studio
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Install  Compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64
    - name: Init Module
      run: go mod init odl || true
    - name: Install Fyne UI
      run: |
        go get fyne.io/fyne/v2
        go mod tidy
    - name: Build EXE for Windows
      env:
        CGO_ENABLED: 1
        CC: x86_64-w64-mingw32-gcc
        GOOS: windows
        GOARCH: amd64
      run: go build -ldflags="-H windowsgui" -o ODL_Studio.exe main.go
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: ODL_Studio_App
        path: ODL_Studio.exe
