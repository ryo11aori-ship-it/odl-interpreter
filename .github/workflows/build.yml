name: Build_ODL
on: [push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/checkout@v4
  - uses: actions/setup-go@v5
    with:
     go-version: '1.22'
  - run: go run main.go test.odl
  - run: GOOS=windows GOARCH=amd64 go build -o odl-repl.exe main.go
  - uses: actions/upload-artifact@v4
    with:
     name: ODL-Windows-EXE
     path: odl-repl.exe
